    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "TimeShit",
        "description": "Aplikasi timesheet modern untuk mencatat jam kerja dengan detail aktivitas, lokasi, dan bukti.",

        "operatingSystem": "Any",

          "price": "0",
          "priceCurrency": "IDR"

          "ratingValue": "4.8",

        }
      }

    <meta name="format-detection" content="telephone=no" />

    <style>
      /* PWA Launch Loading Screen */
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0e17;
        transition:
          opacity 0.5s ease,
          visibility 0.5s ease;
      }
      #app-loading.done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-loading .loader-ring {
        width: 56px;
        height: 56px;
        position: relative;
      }
      #app-loading .loader-ring::before,
      #app-loading .loader-ring::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid transparent;
      }
      #app-loading .loader-ring::before {
        border-top-color: #f97316;
        border-right-color: #f97316;
        animation: loader-spin 0.8s linear infinite;
      }
      #app-loading .loader-ring::after {
        border-bottom-color: rgba(249, 115, 22, 0.25);
        border-left-color: rgba(249, 115, 22, 0.25);
        animation: loader-spin 1.4s linear infinite reverse;
      }
      @keyframes loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #app-loading .loader-logo {
        width: 32px;
        height: 32px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #f97316;
      }
      #app-loading .loader-text {
        margin-top: 20px;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 14px;
        color: #94a3b8;
        letter-spacing: 0.05em;
        animation: loader-pulse 2s ease-in-out infinite;
      }
      @keyframes loader-pulse {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading">
        <div class="loader-ring">
          <svg
            class="loader-logo"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
        </div>
        <div class="loader-text">TimeShit</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
